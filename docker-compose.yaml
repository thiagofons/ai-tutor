services:
  gateway:
    container_name: gateway
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - AUTHENTICATION_SECRET_KEY=${AUTHENTICATION_SECRET_KEY}
      - AUTHENTICATION_SECRET_EXPIRATION=${AUTHENTICATION_SECRET_EXPIRATION}
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - "4000:8080"
    networks:
      - net

  worker:
    container_name: worker
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - rabbitmq
    networks:
      - net

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    networks:
      - net
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
      - type: bind
        source: ./config/rabbitmq/rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf
      - type: bind
        source: ./config/rabbitmq/rabbitmq-defs.json
        target: /etc/rabbitmq/rabbitmq-defs.json

  postgres:
    image: postgres:17-alpine
    container_name: gateway-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gateway-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gateway-db"]
      interval: 5s
      timeout: 5s
      retries: 5    

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

networks:
  net:
    driver: bridge

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
  postgres-data:
    driver: local