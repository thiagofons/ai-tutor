spring:
  application:
    name: worker

  threads:
    virtual:
      enabled: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin
    publisher-returns: true
    listener:
      simple:
        prefetch: 1
        concurrency: 5
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000ms
          multiplier: 2.0
          max-attempts: 3

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

app:
  rabbitmq:
    queues:
      input: ai.items.input
      dlq: ai.items.input.dlq
      output: ai.items.output
    exchanges:
      input: ai.input.exchange
      output: ai.output.exchange
    routing-keys:
      input: ai.input.created
      output: ai.output.processed