spring:
  threads:
    virtual:
      enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        prefetch: 1
        concurrency: 5
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000ms
          multiplier: 2.0
          max-attempts: 3

app:
  gateway:
    security:
      token:
        secret: ${AUTHENTICATION_SECRET_KEY}
        expiration: ${AUTHENTICATION_SECRET_EXPIRATION}

  rabbitmq:
    queues:
      input: ai.itens.input
      dlq: ai.itens.input.dlq
      output: ai.itens.output
    exchanges:
      input: ai.input.exchange
      output: ai.output.exchange
    routing-keys:
      input: ai.input.created
      output: ai.output.processed