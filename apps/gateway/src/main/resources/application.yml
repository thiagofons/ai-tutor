spring:
  application:
    name: gateway

  threads:
    virtual:
      enabled: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        prefetch: 1
        concurrency: 5
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000ms
          multiplier: 2.0
          max-attempts: 3

  datasource:
    url: jdbc:postgresql://postgres:5432/gateway-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  gateway:
    security:
      token:
        secret: ${AUTHENTICATION_SECRET_KEY}
        expiration: ${AUTHENTICATION_SECRET_EXPIRATION}

  rabbitmq:
    queues:
      input: ai.items.input
      dlq: ai.items.input.dlq
      output: ai.items.output
    exchanges:
      input: ai.input.exchange
      output: ai.output.exchange
    routing-keys:
      input: ai.input.created
      output: ai.output.processed